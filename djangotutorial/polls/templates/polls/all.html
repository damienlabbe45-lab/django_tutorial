<h1>Tout les sonndages</h1>

{% if latest_question_list %}

<ul>
{% for question in latest_question_list %}
<li>
    <a href = "{% url 'poll:frequency' question.id}">
        {{ question.question_text}}
    </a>
<small>  ({{ question.pub_date }}) </small>

</li>
{% endfor %}

</ul>

{% else %}
<p> Aucun sondage disponible. Veuillez attendre plus tard</p>

<br> <br>
<a href = "{url 'poll:index' %}"> Retour à l'accueil</a>
