<h1>Créer un nouveau sondage</h1>

<form action="" method="post">
    {% csrf_token %}
    
    <label for="question_text">Intitulé de la question :</label>
    <input type="text" name="question_text" id="question_text" required>
    <br>
    <br>
    <h3>Choix possibles (jusqu'à 5) :</h3>
    <br>
    <div>
        <input type="text" name="choice1" placeholder="Choix 1"><br>
        <input type="text" name="choice2" placeholder="Choix 2"><br>
        <input type="text" name="choice3" placeholder="Choix 3"><br>
        <input type="text" name="choice4" placeholder="Choix 4"><br>
        <input type="text" name="choice5" placeholder="Choix 5">
    </div>
    <br>
    <button type="submit">Créer le sondage</button>
</form>

<br>
<a href="{% url 'polls:index' %}">← Retour à l'accueil</a>
